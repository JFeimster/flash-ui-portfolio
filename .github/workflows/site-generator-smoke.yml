name: Site Generator smoke
on:
  pull_request:
    branches: [main]
    paths:
      - "generator/**"
      - "assets/js/portfolio-nav.mjs"
      - "assets/css/portfolio-nav.css"
      - "scripts/sync-portfolio-nav.mjs"
      - "scripts/smoke-portfolio-navigation.mjs"
      - "tests/portfolio-navigation.test.mjs"
      - "scripts/build-ideas-discovery.mjs"
      - "tests/ideas-index.test.mjs"
      - "workbench/**"
      - "factory/**"
      - "capabilities/**"
      - "ecosystem/**"
      - "imports/**"
      - "build/**"
      - "data/index.html"
      - "404.html"
      - "index.html"
      - "collections/**"
      - "data/collections/**"
      - "data/collections-registry.json"
      - "data/business-calculator-ideas.json"
      - "tools/**"
      - "assets/js/collection-detail.mjs"
      - "assets/js/workflow-lab*.mjs"
      - "assets/js/extra-financial-calculators-core.mjs"
      - "assets/js/lead-tools-core.mjs"
      - "assets/js/agency-kit-core.mjs"
      - "assets/js/business-calculators.mjs"
      - "scripts/smoke-collections.mjs"
      - "ideas/**"
      - "assets/js/ideas.js"
      - "assets/css/ideas.css"
      - "data/idea-directory.json"
      - "data/external-prompt-library.json"
      - "scripts/smoke-ideas.mjs"
      - "assets/js/app.js"
      - "assets/js/voltage-ui.js"
      - "assets/css/voltage.css"
      - "assets/js/site-generator.js"
      - "assets/js/use-asset.mjs"
      - "assets/js/zip-store.mjs"
      - "assets/js/variant-hub.js"
      - "assets/css/generator.css"
      - "assets/css/use-asset.css"
      - "sites/index.html"
      - "use-asset/**"
      - "data/asset-packages.json"
      - "scripts/build-asset-packages.mjs"
      - "scripts/smoke-use-asset.mjs"
      - "data/site-generator-*.json"
      - "scripts/smoke-site-generator.mjs"
      - ".github/workflows/site-generator-smoke.yml"
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "assets/js/portfolio-nav.mjs"
      - "assets/css/portfolio-nav.css"
      - "scripts/sync-portfolio-nav.mjs"
      - "scripts/smoke-portfolio-navigation.mjs"
      - "tests/portfolio-navigation.test.mjs"
      - "scripts/build-ideas-discovery.mjs"
      - "tests/ideas-index.test.mjs"
      - "workbench/**"
      - "factory/**"
      - "capabilities/**"
      - "ecosystem/**"
      - "imports/**"
      - "build/**"
      - "data/index.html"
      - "404.html"
      - "index.html"
      - "assets/js/app.js"
      - "assets/js/voltage-ui.js"
      - "assets/css/voltage.css"
      - "assets/js/site-generator.js"
      - "assets/js/use-asset.mjs"
      - "assets/js/zip-store.mjs"
      - "assets/js/variant-hub.js"
      - "assets/css/generator.css"
      - "assets/css/use-asset.css"
      - "sites/index.html"
      - "use-asset/**"
      - "data/asset-packages.json"
      - "scripts/build-asset-packages.mjs"
      - "scripts/smoke-use-asset.mjs"
      - "data/site-generator-*.json"
      - "scripts/smoke-site-generator.mjs"
      - ".github/workflows/site-generator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-generator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the static portfolio
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/site-generator-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/generator/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-generator-http.log
          exit 1
      - name: Check portfolio navigation contract and generated markup
        run: |
          node scripts/sync-portfolio-nav.mjs --check
          node --test tests/portfolio-navigation.test.mjs tests/ideas-index.test.mjs
      - name: Assert preserved route inventory and protected data for Batch 35
        if: github.event_name == 'pull_request' && github.head_ref == 'batch-35-shared-navigation'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --exit-code "$BASE_SHA" HEAD -- data ':(exclude)data/index.html' sites ':(exclude)sites/index.html'
          python3 - <<'PY'
          import os, subprocess
          def html(ref):
              return {p for p in subprocess.check_output(['git','ls-tree','-r','--name-only',ref],text=True).splitlines() if p.endswith('.html')}
          missing=html(os.environ['BASE_SHA'])-html('HEAD')
          assert not missing, f'Existing HTML entrypoints removed: {sorted(missing)}'
          print(f'{len(html(os.environ["BASE_SHA"]))} baseline HTML entrypoints preserved.')
          PY
      - name: Exercise shared navigation on desktop and mobile
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/smoke-portfolio-navigation.mjs
      - name: Exercise the Site Generator
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/smoke-site-generator.mjs
      - name: Exercise Idea Factory
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/smoke-ideas.mjs
      - name: Exercise collections and all working tools
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/smoke-collections.mjs
      - name: Check asset package manifest for asset-related changes
        run: |
          # Generator/theme changes do not affect the static-site asset package manifest.
          # Run the deterministic manifest check when its source inputs change.
          git fetch --no-tags --depth=1 origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^(sites/|data/asset-route-resolution\\.json$|data/asset-showcase\\.json$|data/asset-packages\\.json$|scripts/build-asset-packages\\.mjs$)'; then
            node scripts/build-asset-packages.mjs
            git diff --exit-code -- data/asset-packages.json
          else
            echo "No asset package inputs changed; manifest regeneration not required."
          fi
      - name: Exercise Use This Asset
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/smoke-use-asset.mjs
