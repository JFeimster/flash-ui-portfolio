name: Capture Flash UI previews
on:
  push:
    branches:
      - batch-34-voltage-preview
      - batch-35-visual-discovery
      - main
    paths:
      - "scripts/capture-previews.mjs"
      - ".github/workflows/capture-portfolio-previews.yml"
      - "data/asset-route-resolution.json"
      - "data/curated-collections.json"
      - "sites/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot dependencies
        run: npm install --no-save --no-package-lock playwright@1.56.1 sharp@0.34.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the checked-out static portfolio
        run: python3 -m http.server 4173 --bind 127.0.0.1 --directory . > /tmp/flash-ui-preview-server.log 2>&1 &
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/voltage-ui.js
          node --check scripts/capture-previews.mjs
      - name: Capture real source previews
        env:
          PREVIEW_BASE_URL: http://127.0.0.1:4173
        run: node scripts/capture-previews.mjs
      - name: Commit preview assets to Batch 35
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/previews/
          git add -- data/asset-previews.json data/preview-capture-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Batch 35: Cache actual interface screenshots [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
