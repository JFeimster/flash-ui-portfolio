name: Data discovery validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/js/data-discovery.js'
      - 'assets/js/ideas.js'
      - 'assets/css/ideas.css'
      - 'ideas/**'
      - 'scripts/build-ideas-v2.mjs'
      - 'tests/ideas-v2.test.mjs'
      - 'assets/js/site-generator.js'
      - 'assets/css/data-discovery.css'
      - 'scripts/build-data-discovery.mjs'
      - 'tests/data-discovery.test.mjs'
      - '.github/workflows/data-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/data-discovery.js && node --check assets/js/site-generator.js && node --check assets/js/ideas.js && node --check scripts/build-data-discovery.mjs && node --check scripts/build-ideas-v2.mjs
      - run: node --test tests/data-discovery.test.mjs tests/ideas-v2.test.mjs
      - run: node scripts/build-ideas-v2.mjs && git diff --exit-code -- data/idea-directory.json
