<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100%">
  <defs>
    <style>
      .bg-dark { fill: #14161f; }
      .stroke-white { stroke: #ffffff; stroke-width: 3; stroke-linejoin: miter; stroke-linecap: square; }
      .fill-cyan { fill: #00f3ff; }
      .fill-magenta { fill: #ff0055; }
      .fill-yellow { fill: #ffee00; }
      .fill-dark { fill: #1a1d29; }
      .text-brutal { font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 11px; fill: #000000; }
      .text-white { fill: #ffffff; }
    </style>
  </defs>

  <!-- ICON 1: FOLDER -->
  <g id="folder-icon" transform="translate(0, 0)">
    <!-- Shadow -->
    <path d="M 16,34 L 41,34 L 46,44 L 91,44 L 91,84 L 16,84 Z" fill="#00f3ff" />
    <!-- Outer Body -->
    <path d="M 12,30 L 37,30 L 42,40 L 87,40 L 87,80 L 12,80 Z" class="fill-dark stroke-white" />
    <!-- Front Flap / Tab Accent -->
    <path d="M 12,48 L 87,48 L 87,80 L 12,80 Z" class="fill-yellow stroke-white" />
    <!-- Symbol Plus -->
    <path d="M 45,64 L 55,64 M 50,59 L 50,69" stroke="#000000" stroke-width="3" stroke-linecap="square" />
  </g>

  <!-- ICON 2: PDF DOCUMENT -->
  <g id="pdf-icon" transform="translate(100, 0)">
    <!-- Shadow -->
    <path d="M 128,19 L 168,19 L 183,34 L 183,89 L 128,89 Z" fill="#ff0055" />
    <!-- Main Sheet -->
    <path d="M 124,15 L 164,15 L 179,30 L 179,85 L 124,85 Z" class="fill-dark stroke-white" />
    <!-- Folded Corner -->
    <path d="M 164,15 L 164,30 L 179,30 Z" fill="#ffffff" class="stroke-white" />
    <!-- Format Badge -->
    <rect x="131" y="50" width="41" height="22" class="fill-magenta stroke-white" />
    <!-- Text Label -->
    <text x="151" y="66" class="text-brutal text-white" text-anchor="middle">PDF</text>
  </g>

  <!-- ICON 3: WORD DOCX -->
  <g id="docx-icon" transform="translate(200, 0)">
    <!-- Shadow -->
    <path d="M 228,19 L 268,19 L 283,34 L 283,89 L 228,89 Z" fill="#00f3ff" />
    <!-- Main Sheet -->
    <path d="M 224,15 L 264,15 L 279,30 L 279,85 L 224,85 Z" class="fill-dark stroke-white" />
    <!-- Folded Corner -->
    <path d="M 264,15 L 264,30 L 279,30 Z" fill="#ffffff" class="stroke-white" />
    <!-- Format Badge -->
    <rect x="231" y="50" width="41" height="22" class="fill-cyan stroke-white" />
    <!-- Text Label -->
    <text x="251" y="66" class="text-brutal" text-anchor="middle">DOC</text>
  </g>

  <!-- ICON 4: SPREADSHEET XLSX -->
  <g id="xlsx-icon" transform="translate(300, 0)">
    <!-- Shadow -->
    <path d="M 328,19 L 368,19 L 383,34 L 383,89 L 328,89 Z" fill="#ffee00" />
    <!-- Main Sheet -->
    <path d="M 324,15 L 364,15 L 379,30 L 379,85 L 324,85 Z" class="fill-dark stroke-white" />
    <!-- Folded Corner -->
    <path d="M 364,15 L 364,30 L 379,30 Z" fill="#ffffff" class="stroke-white" />
    <!-- Format Badge -->
    <rect x="331" y="50" width="41" height="22" class="fill-yellow stroke-white" />
    <!-- Text Label -->
    <text x="351" y="66" class="text-brutal" text-anchor="middle">XLS</text>
  </g>

  <!-- ICON 5: ZIP ARCHIVE -->
  <g id="zip-icon" transform="translate(400, 0)">
    <!-- Shadow -->
    <path d="M 428,19 L 468,19 L 483,34 L 483,89 L 428,89 Z" fill="#ffffff" />
    <!-- Main Sheet -->
    <path d="M 424,15 L 464,15 L 479,30 L 479,85 L 424,85 Z" class="fill-dark stroke-white" />
    <!-- Folded Corner -->
    <path d="M 464,15 L 464,30 L 479,30 Z" fill="#ffffff" class="stroke-white" />
    <!-- Zipper Teeth Line -->
    <line x1="451" y1="35" x2="451" y2="75" stroke="#ffffff" stroke-width="4" stroke-dasharray="4 4" />
    <!-- Zipper Pull Slider -->
    <rect x="446" y="50" width="10" height="15" class="fill-magenta stroke-white" />
  </g>

  <!-- ICON 6: GENERIC FILE / IMAGE -->
  <g id="generic-icon" transform="translate(500, 0)">
    <!-- Shadow -->
    <path d="M 528,19 L 568,19 L 583,34 L 583,89 L 528,89 Z" fill="#ff0055" />
    <!-- Main Sheet -->
    <path d="M 524,15 L 564,15 L 579,30 L 579,85 L 524,85 Z" class="fill-dark stroke-white" />
    <!-- Folded Corner -->
    <path d="M 564,15 L 564,30 L 579,30 Z" fill="#ffffff" class="stroke-white" />
    <!-- Graphic Layout Details inside page -->
    <line x1="534" y1="45" x2="564" y2="45" stroke="#00f3ff" stroke-width="3" stroke-linecap="square" />
    <line x1="534" y1="55" x2="554" y2="55" stroke="#ffffff" stroke-width="3" stroke-linecap="square" />
    <line x1="534" y1="65" x2="569" y2="65" stroke="#ffee00" stroke-width="3" stroke-linecap="square" />
  </g>
</svg>