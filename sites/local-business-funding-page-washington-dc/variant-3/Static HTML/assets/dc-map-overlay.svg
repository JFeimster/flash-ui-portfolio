<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C5A059" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#C5A059" stop-opacity="0.05" />
        </linearGradient>
    </defs>

    <!-- Stylized Grid -->
    <g stroke="rgba(197, 160, 89, 0.1)" stroke-width="0.5">
        <line x1="0" y1="100" x2="500" y2="100" />
        <line x1="0" y1="200" x2="500" y2="200" />
        <line x1="0" y1="300" x2="500" y2="300" />
        <line x1="0" y1="400" x2="500" y2="400" />
        <line x1="100" y1="0" x2="100" y2="500" />
        <line x1="200" y1="0" x2="200" y2="500" />
        <line x1="300" y1="0" x2="300" y2="500" />
        <line x1="400" y1="0" x2="400" y2="500" />
    </g>

    <!-- DC Boundary Shape (The Diamond with Potomac Cutout) -->
    <path d="M250 20 L480 250 L250 480 L205 435 L190 410 L170 380 L140 350 L110 330 L80 300 L20 250 L250 20Z" 
          fill="url(#mapGradient)" 
          stroke="#C5A059" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- District Neighborhood Nodes -->
    <!-- Georgetown/West End -->
    <circle cx="120" cy="240" r="4" fill="#C5A059" filter="url(#goldGlow)" />
    
    <!-- K Street / Downtown -->
    <circle cx="230" cy="230" r="5" fill="#C5A059" filter="url(#goldGlow)" />
    
    <!-- Adams Morgan -->
    <circle cx="210" cy="160" r="4" fill="#C5A059" filter="url(#goldGlow)" />
    
    <!-- Navy Yard / Capitol Riverfront -->
    <circle cx="310" cy="350" r="5" fill="#C5A059" filter="url(#goldGlow)" />
    
    <!-- H Street Corridor -->
    <circle cx="340" cy="240" r="4" fill="#C5A059" filter="url(#goldGlow)" />
    
    <!-- Ivy City / NoMa -->
    <circle cx="290" cy="200" r="4" fill="#C5A059" filter="url(#goldGlow)" />

    <!-- Stylized Connectivity Lines -->
    <g stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4">
        <line x1="230" y1="230" x2="120" y2="240" />
        <line x1="230" y1="230" x2="210" y2="160" />
        <line x1="230" y1="230" x2="310" y2="350" />
        <line x1="230" y1="230" x2="340" y2="240" />
    </g>

    <!-- Compass Rose Element (Bottom Right) -->
    <g transform="translate(420, 420) scale(0.5)" stroke="#C5A059" stroke-width="1.5" opacity="0.6">
        <line x1="0" y1="-40" x2="0" y2="40" />
        <line x1="-40" y1="0" x2="40" y2="0" />
        <path d="M-10 -10 L0 -30 L10 -10 L30 0 L10 10 L0 30 L-10 10 L-30 0 Z" fill="none" />
    </g>
</svg>