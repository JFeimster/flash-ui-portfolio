<svg width="600" height="320" viewBox="0 0 600 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #1A1A1A; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .label { font-family: 'Inter', sans-serif; font-size: 14px; fill: #1A1A1A; font-weight: 800; text-transform: uppercase; }
    .value { font-family: 'JetBrains Mono', monospace; font-size: 18px; fill: #1A1A1A; font-weight: 700; }
    .grid { stroke: rgba(26, 26, 26, 0.1); stroke-width: 1; }
    .border { stroke: #1A1A1A; stroke-width: 2; }
    .accent { fill: #FF3B30; }
    .success { fill: #008148; }
    .dim { fill: #666; font-size: 9px; }
  </style>

  <!-- Background Grid Pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(26,26,26,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="320" fill="#F9F9F7" />
  <rect width="600" height="320" fill="url(#grid)" />

  <!-- Vertical Divider -->
  <line x1="300" y1="40" x2="300" y2="280" stroke="#1A1A1A" stroke-width="2" stroke-dasharray="4 4" />

  <!-- TYPE 01: REVENUE-BASED FINANCING -->
  <g transform="translate(40, 40)">
    <text class="text accent" y="0">FINANCING_TYPE_01</text>
    <text class="label" y="25">REV-BASED FINANCING</text>
    
    <!-- RBF Graphic -->
    <g transform="translate(0, 50)">
      <rect width="220" height="120" class="border" fill="white" fill-opacity="0.5" />
      <!-- Circular Flow Icon -->
      <path d="M 110 30 A 30 30 0 1 1 80 60" stroke="#1A1A1A" stroke-width="3" fill="none" />
      <path d="M 80 60 L 75 50 M 80 60 L 90 55" stroke="#1A1A1A" stroke-width="3" />
      <circle cx="110" cy="60" r="12" class="accent" />
      <text x="106" y="65" fill="white" font-family="monospace" font-size="14" font-weight="bold">%</text>
      <text class="dim" x="10" y="110">PAYMENT SCALES WITH REVENUE</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(0, 190)">
      <text class="text" y="0">EST. COST OF CAPITAL</text>
      <text class="value success" y="25">6% - 12% OF REV</text>
      
      <text class="text" y="55">IDEAL FOR ROAS</text>
      <text class="value" y="80">&gt; 3.0X</text>
    </g>
  </g>

  <!-- TYPE 02: VENTURE DEBT -->
  <g transform="translate(340, 40)">
    <text class="text accent" y="0">FINANCING_TYPE_02</text>
    <text class="label" y="25">VENTURE DEBT</text>

    <!-- Debt Graphic -->
    <g transform="translate(0, 50)">
      <rect width="220" height="120" class="border" fill="white" fill-opacity="0.5" />
      <!-- Step Icon -->
      <path d="M 40 90 L 80 90 L 80 60 L 120 60 L 120 30 L 160 30" stroke="#1A1A1A" stroke-width="3" fill="none" />
      <rect x="110" y="50" width="20" height="20" class="border" fill="#1A1A1A" />
      <text class="dim" x="10" y="110">FIXED AMORTIZATION SCHEDULE</text>
    </g>

    <!-- Metrics -->
    <g transform="translate(0, 190)">
      <text class="text" y="0">EST. COST OF CAPITAL</text>
      <text class="value" y="25">WARRANTS + 12-15%</text>
      
      <text class="text" y="55">IDEAL FOR ROAS</text>
      <text class="value" y="80">&gt; 4.5X</text>
    </g>
  </g>

  <!-- Footer Frame -->
  <rect x="20" y="20" width="560" height="280" class="border" fill="none" pointer-events="none" />
  
  <!-- Corner Labels -->
  <text class="text" x="30" y="295">PROTOCOL: FUNDING_ELIGIBILITY_V1</text>
  <text class="text" x="480" y="295">REF: SL-2024</text>
</svg>