<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 
    TACTICAL ICON SET: LEADERSHIP FIELD MANUAL 
    STYLE: STENCIL / RUGGED / MILITARY SOP
  -->
  
  <defs>
    <style>
      .st-black { fill: #1a1a1a; }
      .st-red { fill: #9e1b1b; }
      .st-olive { fill: #4b5320; }
      .stencil-path { fill-rule: evenodd; }
    </style>
  </defs>

  <!-- SOP / DOSSIER ICON -->
  <symbol id="icon-sop" viewBox="0 0 24 24">
    <path class="st-black stencil-path" d="M13 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V9l-7-7zM6 4h6v5h5v11H6V4zm2 7h8v2H8v-2zm0 4h8v2H8v-2z"/>
    <rect x="14" y="3" width="1" height="5" class="st-black" transform="rotate(45 14 3)"/>
  </symbol>

  <!-- COMMAND / RANK ICON (Chevrons) -->
  <symbol id="icon-command" viewBox="0 0 24 24">
    <path class="st-olive stencil-path" d="M12 4L3 8v3l9-4 9 4V8l-9-4zm0 5L3 13v3l9-4 9 4v-3l-9-4zm0 5l-9 4v3l9-4 9 4v-3l-9-4z"/>
  </symbol>

  <!-- OBJECTIVE / TARGET ICON -->
  <symbol id="icon-objective" viewBox="0 0 24 24">
    <path class="st-red stencil-path" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v3h-2zm0 10h2v3h-2zm-7-7h3v2H4zm13 0h3v2h-3z"/>
    <circle cx="12" cy="12" r="1.5" class="st-red"/>
  </symbol>

  <!-- INTEL / SURVEILLANCE ICON -->
  <symbol id="icon-intel" viewBox="0 0 24 24">
    <path class="st-black stencil-path" d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.65 0-3 1.35-3 3s1.35 3 3 3 3-1.35 3-3-1.35-3-3-3z"/>
  </symbol>

  <!-- MANEUVER / STRATEGY ICON (Crossed Arrows) -->
  <symbol id="icon-maneuver" viewBox="0 0 24 24">
    <path class="st-black stencil-path" d="M10.5 9h3L12 6l-1.5 3zm-2.12 2.12l2.12 2.12 2.12-2.12L10.5 9h-2.12zm10.24 2.12l-2.12-2.12-2.12 2.12 2.12 2.12 2.12-2.12zM5.38 13.24l2.12-2.12L5.38 9l-2.12 2.12 2.12 2.12zM12 18l1.5-3h-3L12 18z"/>
    <path class="st-black" d="M11 2h2v4h-2zm0 16h2v4h-2zm-9-7v2h4v-2zm16 0v2h4v-2z"/>
  </symbol>

  <!-- INTEGRITY / SHIELD ICON -->
  <symbol id="icon-integrity" viewBox="0 0 24 24">
    <path class="st-olive stencil-path" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
    <polygon points="12,7 13.5,10 16.5,10.5 14.5,12.5 15,15.5 12,14 9,15.5 9.5,12.5 7.5,10.5 10.5,10" class="st-olive"/>
  </symbol>

  <!-- GRID LAYOUT FOR PREVIEW (Optional but useful for static asset management) -->
  <use href="#icon-sop" x="0" y="0" width="20" height="20" />
  <use href="#icon-command" x="25" y="0" width="20" height="20" />
  <use href="#icon-objective" x="50" y="0" width="20" height="20" />
  <use href="#icon-intel" x="0" y="25" width="20" height="20" />
  <use href="#icon-maneuver" x="25" y="25" width="20" height="20" />
  <use href="#icon-integrity" x="50" y="25" width="20" height="20" />

</svg>