<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARMORY | QUOTE GRENADE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #000000;
            --red: #FF0000;
            --cream: #FDFCF0;
            --border: 4px solid #000000;
            --shadow: 8px 8px 0px #000000;
            --transition: 0.1s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            background-color: var(--cream);
            font-family: 'Space Mono', monospace;
            color: var(--black);
            line-height: 1.2;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- Nav --- */
        nav {
            background: var(--black);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: var(--border);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-family: 'Archivo Black';
            font-size: 1.5rem;
        }

        .back-link {
            color: var(--red);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* --- Header --- */
        .armory-header {
            padding: 60px 0;
            border-bottom: var(--border);
            margin-bottom: 40px;
        }

        .title-block {
            background: var(--red);
            display: inline-block;
            padding: 10px 20px;
            color: white;
            transform: rotate(-1deg);
            margin-bottom: 20px;
        }

        .search-container {
            margin-top: 40px;
        }

        #search-input {
            width: 100%;
            padding: 20px;
            font-family: 'Archivo Black';
            font-size: 1.5rem;
            border: var(--border);
            box-shadow: var(--shadow);
            outline: none;
            background: white;
        }

        #search-input:focus {
            background: #fffdf0;
            transform: translate(-2px, -2px);
            box-shadow: 10px 10px 0px var(--black);
        }

        /* --- Filters --- */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
        }

        .filter-btn {
            background: white;
            border: var(--border);
            padding: 8px 16px;
            font-family: 'Archivo Black';
            font-size: 0.8rem;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px var(--black);
            transition: var(--transition);
        }

        .filter-btn.active {
            background: var(--black);
            color: white;
        }

        .filter-btn:active {
            box-shadow: 0px 0px 0px var(--black);
            transform: translate(4px, 4px);
        }

        /* --- Grid --- */
        .armory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 80px;
        }

        .grenade-item {
            background: white;
            border: var(--border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
            transition: transform 0.2s;
            position: relative;
        }

        .grenade-item:hover {
            transform: scale(1.02);
            z-index: 2;
        }

        .grenade-item:nth-child(even) { transform: rotate(0.5deg); }
        .grenade-item:nth-child(odd) { transform: rotate(-0.5deg); }

        .grenade-cat {
            font-size: 0.7rem;
            font-weight: 700;
            background: var(--black);
            color: white;
            display: inline-block;
            padding: 2px 8px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .grenade-text {
            font-family: 'Archivo Black';
            font-size: 1.2rem;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .grenade-meta {
            margin-top: 20px;
            font-size: 0.7rem;
            border-top: 1px solid #ddd;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .copy-trigger {
            color: var(--red);
            font-weight: bold;
            cursor: pointer;
        }

        /* --- Footer --- */
        footer {
            background: var(--black);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        @media (max-width: 600px) {
            #search-input { font-size: 1rem; }
            .armory-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-container">
            <a href="index.html" class="logo">QUOTE GRENADE</a>
            <a href="index.html" class="back-link">← PULL THE PIN</a>
        </div>
    </nav>

    <main class="container">
        <header class="armory-header">
            <div class="title-block">
                <h1>THE ARMORY</h1>
            </div>
            <p>ARCHIVE OF DISRUPTION. BROWSE THE SHRAPNEL.</p>
            
            <div class="search-container">
                <input type="text" id="search-input" placeholder="SEARCH BY KEYWORD...">
            </div>

            <div class="filters" id="filter-bar">
                <button class="filter-btn active" data-cat="all">ALL STOCK</button>
                <button class="filter-btn" data-cat="liberty">LIBERTY</button>
                <button class="filter-btn" data-cat="founder">FOUNDER TRUTHS</button>
                <button class="filter-btn" data-cat="chaos">CHAOS</button>
                <button class="filter-btn" data-cat="metamodern">METAMODERN RIFFS</button>
            </div>
        </header>

        <section class="armory-grid" id="armory-grid">
            <!-- Items injected by JS -->
        </section>
    </main>

    <footer>
        <p>QUOTE GRENADE ARMORY // V1.0 // NO PERMISSION REQUIRED.</p>
    </footer>

    <script>
        const inventory = [
            { text: "Privacy is not a luxury; it is a weapon.", cat: "liberty" },
            { text: "If it's not permissionless, it's a prison.", cat: "liberty" },
            { text: "Software eats the law while the lawyers are sleeping.", cat: "founder" },
            { text: "Exit is the ultimate form of voice.", cat: "metamodern" },
            { text: "Build things that make governments obsolete.", cat: "founder" },
            { text: "Your comfort zone is a subsidized hallucination.", cat: "metamodern" },
            { text: "The most radical thing you can do is be self-sufficient.", cat: "liberty" },
            { text: "Bureaucracy is the art of making the possible impossible.", cat: "chaos" },
            { text: "Code is the only constitution that doesn't require an interpreter.", cat: "founder" },
            { text: "Taxation is the subscription fee for a service you can't cancel.", cat: "chaos" },
            { text: "The network state begins in your group chat.", cat: "founder" },
            { text: "Fiat is a slow-motion rug pull.", cat: "metamodern" },
            { text: "Regulations are just moat-building for the uninspired.", cat: "founder" },
            { text: "Don't ask for permission. Ask for forgiveness. Or just be anonymous.", cat: "liberty" },
            { text: "Centralization is a single point of failure for humanity.", cat: "liberty" },
            { text: "Your 9-to-5 is a bribe to forget your dreams.", cat: "metamodern" },
            { text: "Decentralize everything until nothing is too big to fail.", cat: "founder" },
            { text: "The future is here, it’s just not encrypted yet.", cat: "founder" },
            { text: "A state is just a corporation with a monopoly on violence.", cat: "liberty" },
            { text: "The jester is the only one allowed to speak the truth in the court.", cat: "chaos" },
            { text: "Consensus is the death of genius.", cat: "metamodern" },
            { text: "Move fast and break things. Especially barriers to entry.", cat: "founder" },
            { text: "Anonymity is the only true meritocracy.", cat: "liberty" },
            { text: "The algorithm is your new god; learn to blaspheme.", cat: "chaos" }
        ];

        const grid = document.getElementById('armory-grid');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentFilter = 'all';
        let searchTerm = '';

        function renderGrid() {
            grid.innerHTML = '';
            
            const filtered = inventory.filter(item => {
                const matchesCat = currentFilter === 'all' || item.cat === currentFilter;
                const matchesSearch = item.text.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCat && matchesSearch;
            });

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'grenade-item';
                div.innerHTML = `
                    <div>
                        <span class="grenade-cat">${item.cat.toUpperCase()}</span>
                        <p class="grenade-text">“${item.text.toUpperCase()}”</p>
                    </div>
                    <div class="grenade-meta">
                        <span>#${Math.floor(Math.random() * 9000 + 1000)}</span>
                        <span class="copy-trigger" onclick="copyItem(this, '${item.text.replace(/'/g, "\\'")}')">COPY SHRAPNEL</span>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function copyItem(el, text) {
            navigator.clipboard.writeText(text);
            const originalText = el.innerText;
            el.innerText = "COPIED!";
            el.style.color = "black";
            setTimeout(() => {
                el.innerText = originalText;
                el.style.color = "var(--red)";
            }, 1000);
        }

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderGrid();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-cat');
                renderGrid();
            });
        });

        // Initialize
        renderGrid();

        // Visual click effect
        document.addEventListener('mousedown', () => { document.body.style.backgroundColor = "#F0F0F0"; });
        document.addEventListener('mouseup', () => { document.body.style.backgroundColor = "var(--cream)"; });
    </script>
</body>
</html></html>
