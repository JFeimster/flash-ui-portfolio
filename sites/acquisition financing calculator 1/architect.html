<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;900&display=swap');

        :root {
            --bone-white: #F5F5F0;
            --acid-green: #DFFF00;
            --verdigris: #43B3AE;
            --oxidized-dark: #2A4B45;
            --black: #0A0A0A;
            --border-width: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body {
            background-color: var(--black);
            font-family: 'Inter', sans-serif;
            color: var(--bone-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .architect-container {
            width: 100%;
            max-width: 900px;
            border: var(--border-width) solid var(--bone-white);
            background: var(--black);
            padding: 60px;
            position: relative;
        }

        .header {
            border-bottom: var(--border-width) solid var(--bone-white);
            margin-bottom: 40px;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        .doc-meta {
            text-align: right;
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .structure-preview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--oxidized-dark);
            border-left: 10px solid var(--verdigris);
        }

        .preview-item {
            display: flex;
            flex-direction: column;
        }

        .preview-label {
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .preview-value {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            color: var(--acid-green);
        }

        .drafting-area {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .field-block {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--verdigris);
        }

        textarea {
            width: 100%;
            background: #111;
            border: 2px solid var(--bone-white);
            color: var(--bone-white);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            padding: 20px;
            outline: none;
            min-height: 120px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            border-color: var(--acid-green);
        }

        .covenants-area {
            min-height: 200px;
            font-size: 1.1rem;
            border-width: 4px;
        }

        .btn-execute {
            width: 100%;
            background-color: var(--acid-green);
            color: var(--black);
            border: none;
            padding: 30px;
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            margin-top: 40px;
            cursor: pointer;
        }

        .btn-execute:hover {
            background-color: var(--bone-white);
            transform: scale(1.02);
            box-shadow: 0 15px 0 var(--verdigris);
        }

        .footer-log {
            margin-top: 60px;
            font-size: 0.7rem;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            color: var(--verdigris);
        }

        @media (max-width: 600px) {
            .architect-container { padding: 20px; }
            .structure-preview { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: flex-start; gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="architect-container">
        <div class="header">
            <h1>Term Sheet<br>Architect</h1>
            <div class="doc-meta">
                Status: Drafting<br>
                Ver: 4.02.A
            </div>
        </div>

        <div class="structure-preview">
            <div class="preview-item">
                <span class="preview-label">Senior Debt</span>
                <span class="preview-value" id="disp-sba">75.0%</span>
            </div>
            <div class="preview-item">
                <span class="preview-label">Seller Carry</span>
                <span class="preview-value" id="disp-seller">15.0%</span>
            </div>
            <div class="preview-item">
                <span class="preview-label">Equity In</span>
                <span class="preview-value" id="disp-equity">10.0%</span>
            </div>
        </div>

        <div class="drafting-area">
            <div class="field-block">
                <label>Protective Covenants (Global)</label>
                <textarea class="covenants-area" placeholder="ENTER BINDING COVENANTS HERE...
1. DSCR Minimum 1.25x
2. No additional senior encumbrance
3. Mandatory quarterly audits">1. Debt Service Coverage Ratio (DSCR) to be maintained at a minimum of 1.25x tested quarterly.
2. Limitation on capital expenditures exceeding $50,000 without prior lender consent.
3. Key-man life insurance required for principal operators.</textarea>
            </div>

            <div class="field-block">
                <label>Closing Conditions</label>
                <textarea placeholder="Specify unique closing prerequisites...">Satisfactory completion of environmental Phase I report. Verification of all accounts receivable over 90 days. Execution of non-compete agreements for all exiting management.</textarea>
            </div>
        </div>

        <button class="btn-execute" onclick="executeLOI()">Execute Letter of Intent</button>

        <div class="footer-log">
            <span>ARCHITECT_ID: 882-LVRG-DOC</span>
            <span>STAMP: 2023.Q4.FINAL</span>
        </div>
    </div>

    <script>
        function executeLOI() {
            const btn = document.querySelector('.btn-execute');
            btn.innerText = "TRANSMITTING...";
            btn.style.backgroundColor = "var(--verdigris)";
            
            setTimeout(() => {
                btn.innerText = "EXECUTED & ARCHIVED";
                btn.style.backgroundColor = "#fff";
                btn.style.color = "#000";
                btn.style.pointerEvents = "none";
                alert("Binding Term Sheet Generated. Check secure portal for PDF export.");
            }, 1800);
        }

        // Logic to pull from localStorage if this were a multi-page app
        window.onload = () => {
            // Simplified logic for standalone display
            console.log("Architect Component Initialized");
        };
    </script>
</body>
</html>
