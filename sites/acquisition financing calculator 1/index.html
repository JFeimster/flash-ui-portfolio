<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash UI Export</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc-container">
        <div class="header">
            <h1>Capital<br>Architecture</h1>
        </div>

        <div class="input-grid">
            <div class="input-wrapper">
                <label>Equity Down (%)</label>
                <input type="number" id="downPayment" value="10" placeholder="00">
            </div>
            <div class="input-wrapper">
                <label>Market Rate (%)</label>
                <input type="number" id="interestRate" value="7.5" step="0.1" placeholder="0.0">
            </div>
        </div>

        <button class="btn-calculate" onclick="calculateLeverage()">Calculate Leverage</button>

        <div class="results-section">
            <div class="result-row">
                <div class="label-group">
                    <span class="editorial-label">SBA 7(a) Senior Debt</span>
                    <span class="percentage" id="sba-val">75%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="sba-bar" style="width: 75%"></div>
                </div>
            </div>

            <div class="result-row">
                <div class="label-group">
                    <span class="editorial-label">Seller Carryback</span>
                    <span class="percentage" id="seller-val">15%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="seller-bar" style="width: 15%"></div>
                </div>
            </div>
        </div>

        <div class="stats-footer">
            <span>Institutional Grade Analytics</span>
            <span>Ref. No: 882-LVRG</span>
            <span>Verdigris Brutalist v1.0</span>
        </div>
    </div>

    <script>
        function calculateLeverage() {
            const downPayment = parseFloat(document.getElementById('downPayment').value) || 0;
            
            // Standard SBA 7(a) max is usually 75-90%
            // This logic calculates a balanced split based on the down payment
            let sba = 0;
            let seller = 0;

            if (downPayment >= 100) {
                sba = 0;
                seller = 0;
            } else {
                // Priority: Keep SBA high, Seller fills the gap
                const totalDebtNeeded = 100 - downPayment;
                
                // Typical SBA 7(a) cap in a leveraged buyout context
                sba = Math.min(totalDebtNeeded, 75);
                seller = totalDebtNeeded - sba;
            }

            // Update DOM
            document.getElementById('sba-val').innerText = sba.toFixed(1) + '%';
            document.getElementById('seller-val').innerText = seller.toFixed(1) + '%';
            
            document.getElementById('sba-bar').style.width = sba + '%';
            document.getElementById('seller-bar').style.width = seller + '%';
        }

        // Initial trigger
        calculateLeverage();
    </script>
    <script src="script.js"></script>
</body>
</html>
