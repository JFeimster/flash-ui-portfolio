<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonshine Capital | Partner Embed Toolkit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-dark: #07080a;
            --card-bg: #111318;
            --card-border: #1f222c;
            --electric-blue: #00f2ff;
            --neon-green: #39ff14;
            --text-main: #ffffff;
            --text-muted: #8a8f9d;
            --accent-gradient: linear-gradient(135deg, #00f2ff 0%, #39ff14 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 20px;
        }

        .route-badge {
            display: inline-block;
            padding: 6px 12px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--electric-blue);
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
        }

        .config-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 20px;
            height: fit-content;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background: #1a1d26;
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--electric-blue);
        }

        .code-output-container {
            position: relative;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        pre {
            background: #000;
            padding: 24px;
            border-radius: 16px;
            overflow-x: auto;
            border: 1px solid var(--card-border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #d1d1d1;
            max-height: 600px;
            white-space: pre-wrap;
        }

        .copy-btn {
            background: var(--accent-gradient);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .copy-btn:hover {
            filter: brightness(1.1);
        }

        .token-attr { color: var(--electric-blue); }
        .token-val { color: var(--neon-green); }
        .token-tag { color: #ff79c6; }

        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="route-badge">PARTNER RESOURCES V2.0</div>
        <h1>Embed Generator</h1>
        <p class="subtitle">Customize the Moonshine Matcher widget for your marketing campaigns.</p>
    </header>

    <div class="grid">
        <aside class="config-panel">
            <div class="input-group">
                <label for="partner-id">Partner ID</label>
                <input type="text" id="partner-id" placeholder="AFF-9982" oninput="generateCode()">
            </div>
            <div class="input-group">
                <label for="campaign-id">Campaign ID</label>
                <input type="text" id="campaign-id" placeholder="FALL-REACH" oninput="generateCode()">
            </div>
            <div class="input-group">
                <label for="source-id">Lead Source</label>
                <input type="text" id="source-id" placeholder="widget-v1" oninput="generateCode()">
            </div>
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--card-border);">
                <p style="font-size: 0.8rem; color: var(--text-muted);">
                    This code generates a standalone landing page widget. Copy the code and save it as an <code>.html</code> file or embed it into an iframe on your site.
                </p>
            </div>
        </aside>

        <main class="code-output-container">
            <div class="code-header">
                <span style="font-family: 'JetBrains Mono'; font-size: 0.8rem; color: var(--text-muted);">WIDGET_CORE_RENDERER.HTML</span>
                <button class="copy-btn" onclick="copyToClipboard()">Copy Code</button>
            </div>
            <pre id="code-display"></pre>
        </main>
    </div>
</div>

<script>
    const baseCode = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
        :root {
            --bg-dark: #07080a; --card-bg: #111318; --card-border: #1f222c;
            --electric-blue: #00f2ff; --neon-green: #39ff14; --text-main: #ffffff;
            --text-muted: #8a8f9d; --accent-gradient: linear-gradient(135deg, #00f2ff 0%, #39ff14 100%);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        #moonshine-matcher-container { width: 100%; max-width: 850px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .hero-section { padding: 60px 40px; text-align: center; background: radial-gradient(circle at top right, rgba(0, 242, 255, 0.05), transparent); }
        .hero-section h1 { font-size: 3rem; font-weight: 800; margin-bottom: 16px; letter-spacing: -1px; }
        .hero-section span.highlight { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-section p { color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 32px; line-height: 1.6; }
        .progress-container { height: 4px; background: var(--card-border); width: 100%; position: relative; }
        #progress-bar { height: 100%; background: var(--accent-gradient); width: 0%; transition: width 0.5s ease; box-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .step { display: none; padding: 40px; animation: fadeIn 0.4s ease-out; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .question-label { font-size: 1.5rem; font-weight: 600; margin-bottom: 30px; display: block; }
        .options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .option-card { background: #1a1d26; border: 1px solid var(--card-border); padding: 24px; border-radius: 16px; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; gap: 8px; }
        .option-card:hover { border-color: var(--electric-blue); background: #212530; transform: translateY(-2px); }
        .option-card.selected { border-color: var(--neon-green); background: rgba(57, 255, 20, 0.05); box-shadow: 0 0 20px rgba(57, 255, 20, 0.1); }
        .option-title { font-weight: 600; font-size: 1.1rem; }
        .cta-button { padding: 16px 32px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: var(--transition); text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .btn-primary { background: var(--accent-gradient); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text-main); }
        .nav-controls { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; }
        #result-panel { padding: 0; }
        .result-header { padding: 40px; background: linear-gradient(to bottom, rgba(0, 242, 255, 0.1), transparent); text-align: center; }
        .route-badge { display: inline-block; padding: 6px 12px; background: rgba(0, 242, 255, 0.1); color: var(--electric-blue); border-radius: 100px; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; margin-bottom: 16px; border: 1px solid rgba(0, 242, 255, 0.2); }
        .result-title { font-size: 2.5rem; margin-bottom: 12px; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 40px; }
        .info-block h4 { color: var(--neon-green); font-size: 0.8rem; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1px; }
        .info-block p { color: var(--text-muted); line-height: 1.5; font-size: 0.95rem; }
        .prep-list { list-style: none; }
        .prep-list li { padding: 8px 0; border-bottom: 1px solid var(--card-border); color: var(--text-main); display: flex; align-items: center; font-size: 0.9rem; }
        .prep-list li::before { content: "→"; margin-right: 12px; color: var(--electric-blue); }
        .action-footer { padding: 40px; background: #0d0f14; display: flex; flex-direction: column; gap: 16px; }
        .copy-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-top: 10px; }
        #affiliate-data { display: none; }
        @media (max-width: 768px) { .hero-section h1 { font-size: 2rem; } .result-grid { grid-template-columns: 1fr; } .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="moonshine-matcher-container">
    <div id="affiliate-data">
        <input type="hidden" name="partner_id" value="{{PID}}">
        <input type="hidden" name="campaign_id" value="{{CID}}">
        <input type="hidden" name="source" value="{{SID}}">
    </div>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <div class="step active" id="step-0">
        <div class="hero-section">
            <div class="route-badge">AI ROUTE ENGINE V2.0</div>
            <h1>Find Your Best <span class="highlight">Funding Route</span></h1>
            <p>Match the applicant to the path that makes the most sense in 60 seconds.</p>
            <button class="cta-button btn-primary" onclick="nextStep()">Start Route Match</button>
        </div>
    </div>
    <!-- ... (Widget internal steps) ... -->
</div>
<script>
    let currentStep = 0; const totalSteps = 8; const selections = {};
    function updateProgress() { document.getElementById('progress-bar').style.width = (currentStep / totalSteps) * 100 + '%'; }
    function nextStep() { document.querySelector(".step#step-"+currentStep).classList.remove('active'); currentStep++; document.querySelector(".step#step-"+currentStep).classList.add('active'); updateProgress(); }
    function selectOption(s, v) { selections[s] = v; setTimeout(nextStep, 300); }
    /* Logic continues as per core renderer v2.0 */
<\/script>
</body>
</html>`;

    function generateCode() {
        const pid = document.getElementById('partner-id').value || 'AFF-9982';
        const cid = document.getElementById('campaign-id').value || 'DIRECT-WEB';
        const sid = document.getElementById('source-id').value || 'widget-v1';

        let finalCode = baseCode
            .replace('{{PID}}', pid)
            .replace('{{CID}}', cid)
            .replace('{{SID}}', sid);

        document.getElementById('code-display').textContent = finalCode;
    }

    function copyToClipboard() {
        const text = document.getElementById('code-display').textContent;
        navigator.clipboard.writeText(text);
        const btn = document.querySelector('.copy-btn');
        btn.innerText = 'COPIED!';
        setTimeout(() => btn.innerText = 'Copy Code', 2000);
    }

    // Initialize
    generateCode();
</script>

</body>
</html>
