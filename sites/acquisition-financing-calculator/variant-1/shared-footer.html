<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;900&display=swap');

        :root {
            --bone-white: #F5F5F0;
            --acid-green: #DFFF00;
            --verdigris: #43B3AE;
            --oxidized-dark: #2A4B45;
            --black: #0A0A0A;
            --border-width: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body {
            background-color: var(--black);
            font-family: 'Inter', sans-serif;
            color: var(--bone-white);
            padding: 40px 20px;
        }

        .ledger-footer {
            max-width: 800px;
            margin: 0 auto;
            border: var(--border-width) solid var(--bone-white);
            padding: 60px;
            background: var(--black);
            position: relative;
        }

        .ledger-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: var(--border-width) solid var(--bone-white);
            margin-bottom: 40px;
            padding-bottom: 10px;
        }

        .ledger-header h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .ledger-status {
            font-weight: 900;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--acid-green);
        }

        .audit-grid {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .audit-item {
            width: 100%;
        }

        .audit-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .audit-label {
            font-family: 'DM Serif Display', serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            font-style: italic;
        }

        .audit-percent {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--verdigris);
        }

        .ledger-track {
            height: 20px;
            width: 100%;
            background: #111;
            border: 2px solid var(--bone-white);
            position: relative;
            overflow: hidden;
        }

        .ledger-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--oxidized-dark), var(--verdigris));
            position: relative;
        }

        .ledger-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 8px,
                rgba(0,0,0,0.15) 8px,
                rgba(0,0,0,0.15) 16px
            );
        }

        .metadata {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #333;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            font-size: 0.65rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.5;
        }

        .metadata span:nth-child(2) { text-align: center; }
        .metadata span:nth-child(3) { text-align: right; }

        @media (max-width: 600px) {
            .ledger-footer { padding: 30px; }
            .ledger-header { flex-direction: column; gap: 10px; }
            .metadata { grid-template-columns: 1fr; gap: 10px; }
            .metadata span { text-align: left !important; }
        }
    </style>
</head>
<body>

    <div class="ledger-footer">
        <div class="ledger-header">
            <h2>The Vetting Ledger</h2>
            <div class="ledger-status">STRICT CONFIDENTIALITY REQ.</div>
        </div>

        <div class="audit-grid">
            <div class="audit-item">
                <div class="audit-info">
                    <span class="audit-label">Financial Audit</span>
                    <span class="audit-percent">82%</span>
                </div>
                <div class="ledger-track">
                    <div class="ledger-fill" style="width: 82%;"></div>
                </div>
            </div>

            <div class="audit-item">
                <div class="audit-info">
                    <span class="audit-label">Legal Review</span>
                    <span class="audit-percent">45%</span>
                </div>
                <div class="ledger-track">
                    <div class="ledger-fill" style="width: 45%;"></div>
                </div>
            </div>

            <div class="audit-item">
                <div class="audit-info">
                    <span class="audit-label">Operational Assessment</span>
                    <span class="audit-percent">12%</span>
                </div>
                <div class="ledger-track">
                    <div class="ledger-fill" style="width: 12%;"></div>
                </div>
            </div>
        </div>

        <div class="metadata">
            <span>Auth: Buyer-001-Principal</span>
            <span>Due Diligence Phase II</span>
            <span>Vault Ref: OXID-449-DD</span>
        </div>
    </div>

</body>
</html>
