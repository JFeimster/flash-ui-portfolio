<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Credit Resources · Flash UI</title><link rel="stylesheet" href="/assets/css/styles.css"><style>main{max-width:1000px;margin:auto;padding:40px 24px}.resources{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.resources article{padding:18px;border:1px solid #8886;border-radius:12px}input{padding:12px;width:100%;margin:15px 0}</style></head><body><main><p><a href="/sites/">← All projects</a></p><h1>Business Credit Resource Library</h1><p>Vendor intelligence, credit stages, fundability, product specifications, automation and verification data. Vendor claims are unverified.</p><input id="q" type="search" placeholder="Search resources"><section class="resources" id="items"></section><p>Related: <a href="https://bizcred-ai.vercel.app/">BizCredit AI</a> · <a href="https://bizcredit-os.vercel.app/">BizCredit OS</a> · <a href="https://bizfin-os.vercel.app/">BizFin OS</a></p></main><script>fetch('/data/business-credit/index.json').then(r=>{if(!r.ok)throw Error('Pending import');return r.json()}).then(d=>{let list=d.resources;const draw=()=>{let q=document.querySelector('#q').value.toLowerCase();document.querySelector('#items').replaceChildren(...list.filter(x=>x.label.toLowerCase().includes(q)).map(x=>{let a=document.createElement('article'),h=document.createElement('h2'),l=document.createElement('a');h.textContent=x.label;l.href=x.path;l.textContent='View JSON';a.append(h,l);return a}))};document.querySelector('#q').addEventListener('input',draw);draw()}).catch(()=>document.querySelector('#items').textContent='Compiled JSON files are prepared for import; they have not been published to this deployment yet.');</script></body></html>
