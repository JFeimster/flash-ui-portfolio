<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growth Efficiency Trends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-deep: #050507;
            --card-bg: rgba(13, 13, 18, 0.8);
            --neon-cyan: #00f2ff;
            --neon-purple: #9d00ff;
            --neon-green: #00ff88;
            --neon-red: #ff0055;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(157, 0, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.08) 0%, transparent 40%);
        }

        .trends-container {
            width: 95%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 16px;
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .stat-trend {
            font-size: 11px;
            margin-top: 4px;
        }

        .trend-up { color: var(--neon-green); }
        .trend-down { color: var(--neon-red); }

        .chart-wrapper {
            position: relative;
            height: 300px;
            width: 100%;
            margin-top: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .btn-period {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-period.active {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            font-weight: 700;
            border-color: var(--neon-cyan);
        }
    </style>
</head>
<body>

<div class="trends-container">
    <header>
        <div>
            <h1>Historical Efficiency</h1>
            <p class="subtitle">LTV:CAC Trajectory (Trailing 12 Months)</p>
        </div>
        <div class="controls">
            <button class="btn-period">6M</button>
            <button class="btn-period active">12M</button>
            <button class="btn-period">ALL</button>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">Current Ratio</div>
            <div class="stat-value">4.2 : 1</div>
            <div class="stat-trend trend-up">↑ 12% vs last month</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Peak Efficiency</div>
            <div class="stat-value">4.8 : 1</div>
            <div class="stat-trend" style="color: var(--text-dim)">Sept 2023</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">System Health</div>
            <div class="status-badge">Optimization Phase</div>
        </div>
    </div>

    <div class="chart-wrapper">
        <canvas id="trendsChart"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('trendsChart').getContext('2d');
    
    // Create Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, 'rgba(0, 242, 255, 0.3)');
    gradient.addColorStop(1, 'rgba(157, 0, 255, 0)');

    const data = {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        datasets: [{
            label: 'LTV:CAC Ratio',
            data: [2.1, 2.3, 1.9, 2.5, 3.1, 3.8, 4.5, 4.8, 4.2, 3.9, 4.0, 4.2],
            borderColor: '#00f2ff',
            borderWidth: 3,
            fill: true,
            backgroundColor: gradient,
            tension: 0.4,
            pointBackgroundColor: '#00f2ff',
            pointBorderColor: '#050507',
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6
        }]
    };

    const config = {
        type: 'line',
        data: data,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(13, 13, 18, 0.9)',
                    titleFont: { family: 'Space Grotesk' },
                    bodyFont: { family: 'Plus Jakarta Sans' },
                    borderColor: 'rgba(255, 255, 255, 0.1)',
                    borderWidth: 1,
                    displayColors: false,
                    callbacks: {
                        label: function(context) {
                            return `Ratio: ${context.parsed.y}:1`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { 
                        color: '#94a3b8',
                        font: { size: 10 }
                    }
                },
                y: {
                    grid: { 
                        color: 'rgba(255, 255, 255, 0.05)',
                        drawBorder: false
                    },
                    ticks: { 
                        color: '#94a3b8',
                        font: { size: 10 },
                        stepSize: 1
                    },
                    suggestedMin: 0,
                    suggestedMax: 6
                }
            }
        }
    };

    new Chart(ctx, config);
</script>

</body>
</html></html>
