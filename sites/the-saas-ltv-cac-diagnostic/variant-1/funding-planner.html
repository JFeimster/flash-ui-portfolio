<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funding Path Planner | Capital Efficiency</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg: #050505;
            --card-bg: #0d0d0d;
            --border: #222222;
            --accent: #ffffff;
            --text-dim: #888888;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--accent);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .planner-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        header {
            margin-bottom: 32px;
            text-align: center;
        }

        h1 {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-dim);
            max-width: 400px;
            margin: 0 auto;
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .input-group input {
            background: #151515;
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 14px;
            outline: none;
        }

        .comparison-engine {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: var(--border);
            border: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .option-panel {
            background: var(--card-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-header {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .cost-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .cost-label {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .recommendation-banner {
            background: #111;
            border-left: 3px solid var(--accent);
            padding: 20px;
            margin-bottom: 30px;
        }

        .rec-title {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .rec-text {
            font-size: 14px;
            font-weight: 600;
        }

        .action-footer {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn:hover {
            opacity: 0.8;
            filter: brightness(1.2);
        }

        .highlight-green { color: var(--success); }
        .bg-green { background: var(--success); }
        .bg-white { background: var(--accent); }

        @media (max-width: 480px) {
            .config-grid, .comparison-engine {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="planner-card">
        <header>
            <h1>Funding Path Planner</h1>
            <p class="subtitle">Compare the cost of capital based on your unit economics.</p>
        </header>

        <div class="config-grid">
            <div class="input-group">
                <label>Capital Needed ($)</label>
                <input type="number" id="capital" value="500000" step="10000">
            </div>
            <div class="input-group">
                <label>Current LTV:CAC</label>
                <input type="number" id="ratio" value="3.5" step="0.1">
            </div>
            <div class="input-group">
                <label>Est. Exit Multiplier (x)</label>
                <input type="number" id="multiplier" value="10" step="1">
            </div>
            <div class="input-group">
                <label>Equity Dilution (%)</label>
                <input type="number" id="dilution" value="15" step="1">
            </div>
        </div>

        <div class="comparison-engine">
            <div class="option-panel">
                <div class="option-header">
                    <span class="dot bg-white"></span>
                    Venture Equity
                </div>
                <div>
                    <div class="cost-value" id="equity-cost">$0</div>
                    <div class="cost-label">Estimated cost at exit based on dilution.</div>
                </div>
            </div>
            <div class="option-panel">
                <div class="option-header">
                    <span class="dot bg-green"></span>
                    Revenue-Based
                </div>
                <div>
                    <div class="cost-value highlight-green" id="rbf-cost">$0</div>
                    <div class="cost-label">Total repayment amount (Principal + Fee).</div>
                </div>
            </div>
        </div>

        <div class="recommendation-banner" id="rec-banner">
            <div class="rec-title">Strategic Recommendation</div>
            <div class="rec-text" id="rec-text">Calculating optimal path...</div>
        </div>

        <div class="action-footer">
            <button class="btn btn-primary">Download Efficiency Report</button>
            <button class="btn btn-secondary" onclick="window.history.back()">Back to Diagnostic</button>
        </div>
    </div>

    <script>
        const capitalInput = document.getElementById('capital');
        const ratioInput = document.getElementById('ratio');
        const multiInput = document.getElementById('multiplier');
        const diluInput = document.getElementById('dilution');

        const equityDisplay = document.getElementById('equity-cost');
        const rbfDisplay = document.getElementById('rbf-cost');
        const recText = document.getElementById('rec-text');
        const recBanner = document.getElementById('rec-banner');

        function calculateFunding() {
            const capital = parseFloat(capitalInput.value) || 0;
            const ratio = parseFloat(ratioInput.value) || 0;
            const multiplier = parseFloat(multiInput.value) || 0;
            const dilutionPercent = parseFloat(diluInput.value) || 0;

            // Equity Cost Calculation:
            // What that % of the company is worth if the current capital scales the biz at 1:1 value.
            // Simplified: (Capital / Dilution%) * Multiplier * Dilution% 
            // Better: Cost of equity = Value of equity at exit. 
            // If $500k buys 15%, the company is valued at $3.33M. 
            // At 10x exit, that 15% is worth $5M.
            const impliedValuation = capital / (dilutionPercent / 100);
            const costAtExit = impliedValuation * multiplier * (dilutionPercent / 100);

            // RBF Cost Calculation:
            // Typical RBF is Principal + 6-12% flat fee.
            const rbfTotal = capital * 1.10; 

            equityDisplay.textContent = `$${(costAtExit/1000000).toFixed(1)}M`;
            rbfDisplay.textContent = `$${(rbfTotal/1000).toFixed(0)}K`;

            // Logic
            if (ratio >= 3) {
                recText.textContent = "Your unit economics are too efficient for equity. Use RBF to preserve ownership.";
                recBanner.style.borderColor = 'var(--success)';
            } else if (ratio >= 1.5) {
                recText.textContent = "Sustainable growth. Mix of RBF for short-term CAC and Equity for long-term R&D.";
                recBanner.style.borderColor = 'var(--warning)';
            } else {
                recText.textContent = "Caution: High cost of capital. Fix LTV:CAC before raising significant debt.";
                recBanner.style.borderColor = 'var(--danger)';
            }
        }

        [capitalInput, ratioInput, multiInput, diluInput].forEach(input => {
            input.addEventListener('input', calculateFunding);
        });

        // Pull LTV:CAC from URL if exists (e.g. ?ratio=4.2)
        const params = new URLSearchParams(window.location.search);
        if(params.has('ratio')) {
            ratioInput.value = params.get('ratio');
        }

        calculateFunding();
    </script>
</body>
</html>
