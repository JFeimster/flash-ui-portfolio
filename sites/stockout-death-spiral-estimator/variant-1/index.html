<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash UI Export</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="spiral-container">
    <header>
        <h1>Inventory Health: CRITICAL</h1>
        <p>Scenario Analysis: Stockout Probability > 84.2%</p>
    </header>

    <div class="simulation-area">
        <div class="divergence-point"></div>
        <div class="divergence-label">STOCKOUT EVENT</div>
        <svg class="svg-chart" viewBox="0 0 800 300">
            <!-- Line A: Funded -->
            <path class="line-funded" d="M 0 200 L 240 120 L 400 100 L 600 80 L 800 60" />
            <text x="710" y="50" class="chart-label" fill="#00f2ff">FUNDED REVENUE</text>
            
            <!-- Line B: Stockout -->
            <path class="line-stockout" d="M 0 200 L 240 120 L 320 250 L 800 295" />
            <text x="710" y="285" class="chart-label" fill="#ff3e3e">DEATH SPIRAL</text>
        </svg>
    </div>

    <div class="damage-report">
        <div class="metric-card">
            <label>Daily Sales Lost</label>
            <div class="value">$2,040</div>
        </div>
        <div class="metric-card">
            <label>Re-Ranking Spend</label>
            <div class="value">$15,500</div>
        </div>
        <div class="metric-card">
            <label>Total Opp. Cost</label>
            <div class="value">$45,820</div>
        </div>
    </div>

    <div class="fix-panel">
        <div class="slider-header">
            <label style="font-weight: 700; text-transform: uppercase; font-size: 12px;">The Fix: Capital Injection</label>
            <span>$0 ——— $250,000</span>
        </div>
        <input type="range" min="0" max="100" value="0">
    </div>

    <div class="cta-container">
        <button class="cta-btn">Secure Inventory & Protect Rank</button>
    </div>
</div>
</body>
</html>
