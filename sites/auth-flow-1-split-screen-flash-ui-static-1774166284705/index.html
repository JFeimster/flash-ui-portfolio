<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash UI Export</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="split-container">
        <!-- Login Form Side -->
        <main class="auth-section">
            <div class="auth-container">
                <div class="logo">
                    <div class="logo-box"></div>
                    SYMMETRY
                </div>

                <div class="header">
                    <h1>Welcome back</h1>
                    <p>Enter your credentials to access the gateway.</p>
                </div>

                <div class="social-group">
                    <button class="social-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.90 3.16-1.84 4.12-1.16 1.16-2.96 2.4-5.84 2.4-4.68 0-8.48-3.8-8.48-8.48s3.8-8.48 8.48-8.48c2.52 0 4.36.96 5.68 2.24l2.32-2.32C18.44 1.92 15.84 1 12.48 1 6.48 1 1.6 5.88 1.6 11.88s4.88 10.88 10.88 10.88c3.24 0 5.68-1.08 7.6-3.08 2-2 2.64-4.8 2.64-7.08 0-.56-.04-1.08-.12-1.6h-10.12z"/></svg>
                        Google
                    </button>
                    <button class="social-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
                        GitHub
                    </button>
                </div>

                <div class="divider">Or continue with email</div>

                <form>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="name@company.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="submit-btn">Sign In to Account</button>
                </form>

                <div class="footer-link">
                    Don't have an account? <a href="#">Create Request</a>
                </div>
            </div>
        </main>

        <!-- Image/Slider Side -->
        <aside class="slider-section">
            <div class="testimonial-container">
                <div class="testimonial-content">
                    <div class="quote-icon">“</div>
                    <p class="testimonial-text">
                        The architectural precision of this platform has redefined how our executive team handles global operations.
                    </p>
                    <div class="testimonial-author">
                        <div class="author-info">
                            <h4>Julian Vossen</h4>
                            <p>Director of Operations, Arclight Int.</p>
                        </div>
                    </div>
                </div>
                <div class="slider-controls">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Simple visual toggle for the dots
        const dots = document.querySelectorAll('.dot');
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                dots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
            });
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
