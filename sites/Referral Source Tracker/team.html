<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-main: #020617;
        --surface: #0f172a;
        --card-bg: #1e293b;
        --card-hover: #334155;
        --border: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --accent: #f8fafc;
        --accent-text: #0f172a;
        --status-online: #10b981;
        --status-away: #f59e0b;
        --status-busy: #ef4444;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        font-family: 'Inter', sans-serif;
        background: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
    }

    .page-header {
        margin-bottom: 32px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .header-title h1 {
        margin: 0;
        font-size: 1.875rem;
        font-weight: 600;
        letter-spacing: -0.025em;
    }

    .header-title p {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-size: 0.938rem;
    }

    /* Search Bar */
    .search-wrapper {
        position: relative;
        width: 100%;
        max-width: 400px;
        margin-bottom: 40px;
    }

    .search-input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px 14px 44px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s;
    }

    .search-input:focus {
        border-color: var(--text-secondary);
        box-shadow: 0 0 0 4px rgba(248, 250, 252, 0.05);
    }

    .search-icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        pointer-events: none;
    }

    /* Team Grid */
    .team-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
    }

    .member-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        transition: transform 0.2s, background 0.2s;
        cursor: default;
    }

    .member-card:hover {
        background: var(--card-bg);
        transform: translateY(-4px);
    }

    .avatar-wrapper {
        position: relative;
        margin-bottom: 16px;
    }

    .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--border);
    }

    .status-indicator {
        position: absolute;
        bottom: 4px;
        right: 4px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 3px solid var(--surface);
    }

    .status-online { background: var(--status-online); }
    .status-away { background: var(--status-away); }
    .status-busy { background: var(--status-busy); }

    .member-name {
        font-weight: 600;
        font-size: 1.05rem;
        margin: 0 0 4px;
    }

    .member-role {
        font-size: 0.813rem;
        color: var(--text-secondary);
        margin-bottom: 20px;
    }

    .btn-schedule {
        width: 100%;
        padding: 10px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-schedule:hover {
        background: var(--accent);
        color: var(--accent-text);
        border-color: var(--accent);
    }

    .btn-schedule svg {
        width: 14px;
        height: 14px;
    }

    @media (max-width: 640px) {
        .page-header {
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }
        .search-wrapper {
            max-width: 100%;
        }
    }
</style>
</head>
<body>
