<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHROMA FORGE // Visual Style Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #0d0d0d;
            --border: #222;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text-main: #e0e0e0;
            --text-dim: #888;
            --glass: rgba(255, 255, 255, 0.03);
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'Space Mono', monospace;
            
            /* Forge Dynamic Vars */
            --forge-primary: #00f2ff;
            --forge-secondary: #7000ff;
            --forge-radius: 12px;
            --forge-glow: 15px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% -20%, #111 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            background: linear-gradient(90deg, var(--accent), #7000ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-link:hover { color: var(--accent); }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .hero h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 15px;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
        }

        .card-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-label::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Lab Components */
        .palette-lab { grid-column: span 5; }
        .typography-lab { grid-column: span 3; }
        .preview-window { grid-column: span 4; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; border: 1px solid var(--accent); }
        .atmosphere-lab { grid-column: span 6; }
        .persona-lab { grid-column: span 6; }
        .token-output { grid-column: span 12; }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 8px; font-family: var(--font-mono); }
        
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 40px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 2px;
        }

        select, input[type="text"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-family: inherit;
        }

        /* Preview Elements */
        .preview-box {
            width: 100%;
            padding: 20px;
            border-radius: var(--forge-radius);
            background: var(--glass);
            border: 1px solid var(--forge-primary);
            box-shadow: 0 0 var(--forge-glow) rgba(0, 242, 255, 0.1);
            text-align: center;
        }

        .preview-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--forge-primary);
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .token-display {
            width: 100%;
            height: 120px;
            background: #050505;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent);
            resize: none;
            margin-top: 10px;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .palette-lab, .typography-lab, .preview-window, .atmosphere-lab, .persona-lab {
                grid-column: span 12;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">⚡ CHROMA-<span>FORGE</span></div>
            <a href="index.html" class="nav-link">← Return to Prompt Lab</a>
        </header>

        <section class="hero">
            <h1>Refine Your Brand DNA.</h1>
            <p style="color: var(--text-dim);">The visual laboratory for high-fidelity interface systems.</p>
        </section>

        <main class="bento-grid">
            <!-- Palette -->
            <div class="card palette-lab">
                <div class="card-label">Primary DNA Colors</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="control-group">
                        <label>Core Accent</label>
                        <input type="color" id="colorAccent" value="#00f2ff" oninput="updateForge()">
                    </div>
                    <div class="control-group">
                        <label>Secondary</label>
                        <input type="color" id="colorSecondary" value="#7000ff" oninput="updateForge()">
                    </div>
                </div>
                <div class="control-group">
                    <label>Base Background</label>
                    <select id="baseTheme" onchange="updateForge()">
                        <option value="#050505">Deep Onyx (#050505)</option>
                        <option value="#0a0b10">Midnight Blue (#0a0b10)</option>
                        <option value="#111111">Matte Carbon (#111111)</option>
                        <option value="#000000">True Black (#000000)</option>
                    </select>
                </div>
            </div>

            <!-- Typography -->
            <div class="card typography-lab">
                <div class="card-label">Type Foundry</div>
                <div class="control-group">
                    <label>Heading Weight</label>
                    <select id="headWeight" onchange="updateForge()">
                        <option value="300">Light</option>
                        <option value="400">Regular</option>
                        <option value="700" selected>Bold</option>
                        <option value="800">Ultra</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Letter Spacing</label>
                    <input type="range" id="letterSpacing" min="-2" max="10" value="-1" oninput="updateForge()">
                </div>
            </div>

            <!-- Preview -->
            <div class="card preview-window">
                <div class="card-label">Live Simulation</div>
                <div class="preview-box" id="previewBox">
                    <div style="font-size: 1.2rem; font-weight: bold;" id="previewText">System Ready</div>
                    <p style="font-size: 0.7rem; color: var(--text-dim); margin: 10px 0;">Component Preview Mode</p>
                    <button class="preview-btn" id="previewBtn">Action Trigger</button>
                </div>
            </div>

            <!-- Atmosphere -->
            <div class="card atmosphere-lab">
                <div class="card-label">Atmosphere & FX</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="control-group">
                        <label>Glow Intensity (px)</label>
                        <input type="range" id="glowRange" min="0" max="50" value="15" oninput="updateForge()">
                    </div>
                    <div class="control-group">
                        <label>Corner Radius</label>
                        <input type="range" id="radiusRange" min="0" max="32" value="12" oninput="updateForge()">
                    </div>
                </div>
            </div>

            <!-- Persona -->
            <div class="card persona-lab">
                <div class="card-label">Identity Persona</div>
                <div class="control-group">
                    <label>Design Language Tone</label>
                    <input type="text" id="personaInput" placeholder="e.g. Aggressive Cyberpunk, Medical Precision, Luxury Minimal..." oninput="updateForge()">
                </div>
            </div>

            <!-- Token Output -->
            <div class="card token-output">
                <div class="card-label">Visual Style Token</div>
                <textarea class="token-display" id="tokenOutput" readonly></textarea>
                <button class="btn-action" onclick="copyToken()">Copy Token to Clipboard</button>
            </div>
        </main>
    </div>

    <script>
        function updateForge() {
            const accent = document.getElementById('colorAccent').value;
            const secondary = document.getElementById('colorSecondary').value;
            const bg = document.getElementById('baseTheme').value;
            const weight = document.getElementById('headWeight').value;
            const spacing = document.getElementById('letterSpacing').value;
            const glow = document.getElementById('glowRange').value;
            const radius = document.getElementById('radiusRange').value;
            const persona = document.getElementById('personaInput').value || "Default Flash-UI";

            // Update Preview
            const previewBox = document.getElementById('previewBox');
            const previewBtn = document.getElementById('previewBtn');
            const previewText = document.getElementById('previewText');

            document.documentElement.style.setProperty('--forge-primary', accent);
            document.documentElement.style.setProperty('--forge-radius', radius + 'px');
            document.documentElement.style.setProperty('--forge-glow', glow + 'px');

            previewBox.style.borderColor = accent;
            previewBox.style.borderRadius = radius + 'px';
            previewBox.style.boxShadow = `0 0 ${glow}px ${accent}44`;
            previewBtn.style.backgroundColor = accent;
            previewText.style.fontWeight = weight;
            previewText.style.letterSpacing = spacing + 'px';

            // Generate Token
            const token = {
                v: "1.0",
                identity: persona,
                colors: { primary: accent, secondary: secondary, bg: bg },
                fx: { glow: glow + "px", radius: radius + "px" },
                type: { weight: weight, spacing: spacing + "px" }
            };

            const tokenString = `FORGE_TOKEN:${btoa(JSON.stringify(token))}`;
            document.getElementById('tokenOutput').value = tokenString;
        }

        function copyToken() {
            const copyText = document.getElementById("tokenOutput");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            
            const btn = document.querySelector('.btn-action');
            btn.innerText = "TOKEN SECURED";
            btn.style.background = "#fff";
            setTimeout(() => {
                btn.innerText = "Copy Token to Clipboard";
                btn.style.background = "var(--accent)";
            }, 2000);
        }

        // Initial call
        updateForge();
    </script>
</body>
</html>
