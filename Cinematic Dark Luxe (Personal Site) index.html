<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian-deep: #050505;
            --obsidian-surface: #0a0a0a;
            --obsidian-edge: #1a1a1a;
            --light-source: rgba(255, 255, 255, 0.08);
            --accent: #ffffff;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        body {
            background-color: var(--obsidian-deep);
            color: var(--accent);
            font-family: var(--font-main);
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Tenebrism Grain Overlay */
        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Light Source / Flashlight Effect */
        #light-flicker {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(600px circle at var(--x) var(--y), rgba(255,255,255,0.04) 0%, transparent 80%);
            pointer-events: none;
            z-index: 10;
        }

        /* Custom Cursor */
        #cursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.2s var(--ease-out-expo);
        }

        #cursor-follower {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.4s var(--ease-out-expo);
        }

        /* Monolith Container */
        .monolith-wrapper {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            perspective: 2000px;
        }

        .monolith {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, var(--obsidian-surface) 0%, var(--obsidian-deep) 100%);
            border: 1px solid var(--obsidian-edge);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        /* Scratched Texture Overlay */
        .monolith::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Sidebar - The Etched Spine */
        .spine {
            width: 80px;
            border-right: 1px solid var(--obsidian-edge);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
            background: rgba(0,0,0,0.2);
            z-index: 5;
        }

        .logo-mono {
            font-family: var(--font-mono);
            font-weight: 800;
            letter-spacing: -2px;
            font-size: 1.5rem;
            transform: rotate(-90deg);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 80px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            z-index: 5;
        }

        .hero-text h1 {
            font-size: clamp(4rem, 8vw, 10rem);
            font-weight: 800;
            line-height: 0.85;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(50px);
            animation: reveal 1.2s var(--ease-out-expo) forwards;
        }

        .hero-text h1 span {
            display: block;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
        }

        .meta-data {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .meta-data::before {
            content: '';
            width: 30px;
            height: 1px;
            background: rgba(255,255,255,0.2);
        }

        .description {
            max-width: 400px;
            font-weight: 300;
            line-height: 1.6;
            color: rgba(255,255,255,0.6);
            margin-bottom: 60px;
            font-size: 1.1rem;
            opacity: 0;
            animation: reveal 1.2s var(--ease-out-expo) 0.2s forwards;
        }

        /* Interactive Call to Action */
        .cta-box {
            position: relative;
            display: inline-block;
            padding: 20px 40px;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent;
            overflow: hidden;
            transition: all 0.4s var(--ease-out-expo);
        }

        .cta-box:hover {
            border-color: #fff;
            padding-right: 60px;
        }

        .cta-box .glint {
            position: absolute;
            top: 0; left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }

        .cta-box:hover .glint {
            left: 150%;
        }

        /* Image Display - The Chiaroscuro Fragment */
        .visual-fragment {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border: 1px solid var(--obsidian-edge);
            overflow: hidden;
        }

        .visual-fragment img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.2) brightness(0.6);
            transition: transform 0.8s var(--ease-out-expo), filter 0.8s var(--ease-out-expo);
        }

        .visual-fragment:hover img {
            transform: scale(1.05);
            filter: grayscale(0.5) contrast(1.1) brightness(0.8);
        }

        .visual-fragment::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, var(--obsidian-deep));
        }

        /* Animations */
        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .nav-links li {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            writing-mode: vertical-rl;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.3);
            transition: color 0.3s;
        }

        .nav-links li:hover {
            color: #fff;
        }

        /* Scroll Progress Mono */
        .progress-mono {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: rgba(255,255,255,0.2);
        }

        @media (max-width: 900px) {
            .content { grid-template-columns: 1fr; padding: 40px; }
            .visual-fragment { display: none; }
            .spine { display: none; }
        }
    </style>
</head>
<body>

    <div class="grain"></div>
    <div id="cursor"></div>
    <div id="cursor-follower"></div>
    <div id="light-flicker"></div>

    <main class="monolith-wrapper">
        <div class="monolith" id="monolith">
            <!-- Spine Navigation -->
            <aside class="spine">
                <div class="logo-mono">AXL.01</div>
                <ul class="nav-links">
                    <li>Works</li>
                    <li>Studio</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
                <div class="social-icons">
                    <i data-lucide="arrow-up-right" size="18" stroke-width="1.5"></i>
                </div>
            </aside>

            <!-- Main Display -->
            <section class="content">
                <div class="hero-text">
                    <div class="meta-data">Design Director & Tech Lead</div>
                    <h1>Obsidian<br><span>Reality</span></h1>
                    <p class="description">
                        Sculpting digital experiences through the lens of tenebrism. High-fidelity systems for the modern avant-garde.
                    </p>
                    
                    <a href="#" class="cta-box">
                        <span class="glint"></span>
                        <span style="font-family: var(--font-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;">
                            Enter the Void
                        </span>
                    </a>
                </div>

                <div class="visual-fragment">
                    <img src="https://images.unsplash.com/photo-1614850715649-1d0106293bd1?auto=format&fit=crop&q=80&w=1000" alt="Dark Aesthetic">
                </div>
            </section>

            <div class="progress-mono">COORD / 52.5200° N, 13.4050° E</div>
        </div>
    </main>

    <script>
        // Lucide Icons
        lucide.createIcons();

        const monolith = document.getElementById('monolith');
        const light = document.getElementById('light-flicker');
        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('cursor-follower');

        // Mouse Move Effects
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            // Update Light Source
            light.style.setProperty('--x', `${x}px`);
            light.style.setProperty('--y', `${y}px`);

            // Update Custom Cursor
            cursor.style.left = `${x}px`;
            cursor.style.top = `${y}px`;
            
            follower.style.left = `${x - 16}px`;
            follower.style.top = `${y - 16}px`;

            // Tilt Effect for Monolith
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const rotateX = (y - centerY) / 100;
            const rotateY = (centerX - x) / 100;

            monolith.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Hover Scaling
        const interactiveElements = document.querySelectorAll('a, li, .visual-fragment');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(4)';
                cursor.style.mixBlendMode = 'difference';
                follower.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
                cursor.style.mixBlendMode = 'normal';
                follower.style.transform = 'scale(1)';
            });
        });

        // Flicker Animation for "Tenebrism" feel
        setInterval(() => {
            const flicker = Math.random() * 0.02 + 0.03;
            light.style.background = `radial-gradient(600px circle at var(--x) var(--y), rgba(255,255,255,${flicker}) 0%, transparent 80%)`;
        }, 150);
    </script>
</body>
</html>
